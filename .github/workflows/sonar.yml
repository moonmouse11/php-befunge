name: SonarQube

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  sonar:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
      with:
        # Full history enables blame information and new-code detection.
        fetch-depth: 0

    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: "8.3"
        coverage: pcov

    - name: Install dependencies
      run: composer update --prefer-dist --no-progress

    - name: Run tests with coverage
      run: vendor/bin/phpunit --coverage-clover=clover.xml

    - name: Normalize coverage paths
      # The Clover report contains absolute paths, which the Sonar scanner
      # cannot match against indexed files.
      run: sed -i "s|$GITHUB_WORKSPACE/||g" clover.xml

    - name: Run SonarQube analysis
      uses: SonarSource/sonarqube-scan-action@v5
      env:
        SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}

